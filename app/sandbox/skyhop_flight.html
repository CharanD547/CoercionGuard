<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SkyHop: Complete your booking</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f2f6fb; margin: 0; color: #1d2733; }
  .wrap { max-width: 560px; margin: 32px auto; padding: 28px; background: #fff; border-radius: 10px; box-shadow: 0 2px 10px #0001; }
  .price { font-size: 32px; font-weight: 800; }
  .scarcity { color: #c62828; font-weight: 600; }
  label { display: block; padding: 10px; margin: 8px 0; border: 1px solid #dde3ea; border-radius: 6px; }
  .cta { display: block; width: 100%; padding: 16px; font-size: 18px; font-weight: 700; color: #fff; background: #ff6a00;
         border: 0; border-radius: 8px; cursor: pointer; margin-top: 18px; }
  .skip { background: none; border: 0; padding: 0; font-size: 10px; color: #c9d1da; margin-top: 10px; cursor: pointer; }
  .fee { font-size: 12px; color: #6b7785; margin-top: 4px; }
  .ad-banner { margin-top: 22px; padding: 14px; background: #e8f5e9; border-radius: 8px; }
  .ad-banner button { padding: 10px 18px; background: #2e7d32; color: #fff; border: 0; border-radius: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <h2>NYC → LIS · Economy Basic</h2>
  <div class="price">$89</div>
  <div class="scarcity">Only 2 seats left at this price!</div>
  <div class="scarcity">14 people are looking at this flight</div>
  <form method="post" action="submit">
    <label><input type="checkbox" name="travel_insurance" value="1" checked> Travel insurance protection +$29</label>
    <label><input type="checkbox" name="seat_selection" value="1" checked> Seat selection (window) +$15</label>
    <label><input type="checkbox" name="priority_boarding" value="1" checked> Priority boarding upgrade +$12</label>
    <div class="fee">A $18 service fee will be added at payment.</div>
    <button class="cta" type="submit" name="action" value="continue">Continue to payment</button>
    <button class="skip" type="submit" name="action" value="skip_extras" aria-label="Skip all extras">I'd rather risk my trip without protection</button>
  </form>
  <div class="ad-banner">Your boarding pass app is ready
    <button type="button" onclick="location.href='submit?ad=1'">Download</button>
  </div>
</div>
</body>
</html>
